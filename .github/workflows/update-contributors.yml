name: Update contributor avatars

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-contributor-avatars
  cancel-in-progress: true

jobs:
  update:
    if: github.repository == 'agent-network-protocol/AgentNetworkProtocol'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update README contributor blocks
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { updateReadmes } = require('./scripts/update_contributors');
            await updateReadmes({ github, context, core });

      - name: Open or update contributor pull request
        env:
          BRANCH: automation/update-contributor-avatars
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if git diff --quiet -- README.md README.cn.md; then
            echo "Contributor avatars are already up to date"
            exit 0
          fi

          git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH" || true
          if git rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1 && \
             git diff --quiet "origin/$BRANCH" -- README.md README.cn.md; then
            echo "The contributor update branch is already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch --create "$BRANCH"
            git add README.md README.cn.md
            git commit -m "docs: update contributor avatars"
            git push --force-with-lease origin "HEAD:$BRANCH"
          fi

          pull_request=$(gh pr list \
            --base main \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [[ -z "$pull_request" ]]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "docs: update contributor avatars" \
              --body "Automatically synchronizes the README contributor avatars from GitHub contributor data."
          else
            echo "Updated contributor pull request #$pull_request"
          fi
